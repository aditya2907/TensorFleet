apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: tensorfleet
  labels:
    app: orchestrator
    app.kubernetes.io/part-of: tensorfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        app.kubernetes.io/part-of: tensorfleet
    spec:
      containers:
      - name: orchestrator
        image: tensorfleet/orchestrator:latest
        ports:
        - containerPort: 50051
          name: grpc
        env:
        - name: PORT
          value: "50051"
        - name: REDIS_ADDR
          valueFrom:
            configMapKeyRef:
              name: tensorfleet-config
              key: redis-addr
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 5
# The `orchestrator` ClusterIP Service lives in deployment.yaml alongside the
# other shared short-named services.
