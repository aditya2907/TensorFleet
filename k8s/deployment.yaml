# Core application deployments and shared ClusterIP services.
#
# Ownership: each Kubernetes object is defined in exactly ONE file.
#   - redis / minio StatefulSets ............ infrastructure.yaml
#   - mongodb / worker-ml / model-service ... mongodb-ml.yaml
#   - api-gateway ........................... api-gateway.yaml
#   - orchestrator .......................... orchestrator.yaml
#   - worker (+ HPA) ........................ worker.yaml
#   - frontend .............................. frontend.yaml
#   - storage / monitoring / prometheus / grafana ... this file
#
# The short-named ClusterIP services (api-gateway, orchestrator, frontend,
# worker-ml) also live here: their DNS names are referenced by the ConfigMap,
# the Prometheus scrape config, ingress.yaml and port-forward.sh.
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: tensorfleet
spec:
  selector:
    app: orchestrator
  ports:
  - port: 50051
    targetPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: tensorfleet
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tensorfleet
spec:
  selector:
    app: frontend
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: worker-ml
  namespace: tensorfleet
spec:
  selector:
    app: worker-ml
  ports:
  - port: 8000
    targetPort: 8000
---
# Storage Service Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  namespace: tensorfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
    spec:
      containers:
      - name: storage
        image: tensorfleet/storage:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: MINIO_ENDPOINT
          value: "minio-service:9000"
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tensorfleet-secrets
              key: minio-access-key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: tensorfleet-secrets
              key: minio-secret-key
        - name: MINIO_SECURE
          value: "false"
        - name: MONGODB_URL
          valueFrom:
            configMapKeyRef:
              name: tensorfleet-config
              key: mongodb-url
        - name: MONGODB_DB
          valueFrom:
            configMapKeyRef:
              name: tensorfleet-config
              key: mongodb-db
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: storage
  namespace: tensorfleet
spec:
  selector:
    app: storage
  ports:
  - port: 8081
    targetPort: 8081
---
# Monitoring Service Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring
  namespace: tensorfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring
  template:
    metadata:
      labels:
        app: monitoring
    spec:
      containers:
      - name: monitoring
        image: tensorfleet/monitoring:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: PORT
          value: "8082"
        - name: COMPOSE_PROJECT_NAME
          value: "tensorfleet"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring
  namespace: tensorfleet
spec:
  selector:
    app: monitoring
  ports:
  - port: 8082
    targetPort: 8082
---
# Prometheus: ServiceAccount + RBAC so kubernetes_sd pod discovery works
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: tensorfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-reader
  namespace: tensorfleet
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-reader
  namespace: tensorfleet
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: tensorfleet
roleRef:
  kind: Role
  name: prometheus-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: tensorfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-data
          mountPath: /prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: tensorfleet
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
# Grafana Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tensorfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: grafana-provisioning
          mountPath: /etc/grafana/provisioning
        - name: grafana-data
          mountPath: /var/lib/grafana
      volumes:
      - name: grafana-provisioning
        configMap:
          name: grafana-provisioning
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: tensorfleet
spec:
  selector:
    app: grafana
  ports:
  - port: 3001
    targetPort: 3000
